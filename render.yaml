services:
  - type: web
    name: ai-mystery-room
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_THINKING_LEVEL
        value: low
      - key: AI_GENERATION_TIMEOUT_MS
        value: "120000"
      - key: AI_MAX_RETRIES
        value: "2"
      - key: AI_MAX_OUTPUT_TOKENS
        value: "12000"
